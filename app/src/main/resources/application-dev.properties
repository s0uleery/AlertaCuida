# Perfil de desarrollo local. Activar con: --spring.profiles.active=dev (ver README).
# Toma las credenciales de la base del .env de la raíz del repositorio (el mismo de docker-compose).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:${DB_PUERTO:5432}/${DB_NOMBRE:alertacuida}

# Además de las migraciones, carga los datos de ejemplo (nunca en producción)
spring.flyway.locations=classpath:db/migration,classpath:db/ejemplo

# Claves solo para desarrollo: el rut_hash del administrador de prueba se calculó con esta clave-run
alertacuida.seguridad.clave-run=clave-run-solo-para-desarrollo-local
alertacuida.seguridad.clave-jwt=clave-jwt-solo-para-desarrollo-local-no-usar-en-produccion
# El rut cifrado del administrador de prueba (datos de ejemplo) se cifró con esta llave
alertacuida.seguridad.clave-cifrado=pWX6Z0qepuUfO6uj2EJcqeCsZvILfiF/7rwH/MBDzqI=
# En local el dashboard corre por http, así que la cookie de renovación no puede exigir HTTPS
alertacuida.seguridad.sesion.cookie-segura=false
