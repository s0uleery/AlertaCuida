spring.application.name=alertacuida

# Base de datos: los valores reales llegan por variables de entorno (nunca en el repositorio)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alertacuida}
spring.datasource.username=${DB_USUARIO:alertacuida}
spring.datasource.password=${DB_CLAVE:}

# Flyway aplica las migraciones de adapters/src/main/resources/db/migration al arrancar
spring.flyway.locations=classpath:db/migration

# Inicio de sesión. Las claves llegan por variables de entorno; sin ellas no arranca.
# RUN_CLAVE: clave del HMAC de rut_hash. Si cambia, hay que recalcular rut_hash de todos los usuarios.
# JWT_CLAVE: firma de los tokens, al menos 32 caracteres.
# CIFRADO_CLAVE: llave AES-256 de los datos personales, 32 bytes en base64 (openssl rand -base64 32).
#   Si se pierde, los datos cifrados no se pueden leer: guardar una copia fuera del servidor (docs/backend.md).
alertacuida.seguridad.clave-run=${RUN_CLAVE}
alertacuida.seguridad.clave-jwt=${JWT_CLAVE}
alertacuida.seguridad.clave-cifrado=${CIFRADO_CLAVE}
alertacuida.seguridad.duracion-token=15m
alertacuida.seguridad.bloqueo.intentos=5
alertacuida.seguridad.bloqueo.ventana=15m

# Valores base del Anexo B: rigen cuando el usuario no tiene ajustes propios.
# PROVISIONALES: falta que los valide el equipo clínico. Cambiarlos cambia la configuración de todos los relojes.
# FC en latidos por minuto: grave bajo < mínimo normal < máximo normal < grave alto.
alertacuida.clinica.umbral-fc.grave-bajo=40
alertacuida.clinica.umbral-fc.normal-min=50
alertacuida.clinica.umbral-fc.normal-max=110
alertacuida.clinica.umbral-fc.grave-alto=130
# SpO2 en %, sin límite alto: grave bajo < mínimo normal.
alertacuida.clinica.umbral-spo2.grave-bajo=88
alertacuida.clinica.umbral-spo2.normal-min=92
# Minutos que el reloj espera la confirmación de un contacto antes de pasar al siguiente.
alertacuida.clinica.minutos-espera=5

# Calendario hábil (horario y feriados): en calendario.yml, porque los nombres de los feriados llevan
# tildes y Spring lee este archivo en Latin-1.
spring.config.import=classpath:calendario.yml

# Enlaces de activación del personal nuevo. DASHBOARD_URL: dirección pública del dashboard.
alertacuida.seguridad.activacion.url=${DASHBOARD_URL:http://localhost:5173}/activar
alertacuida.seguridad.activacion.vigencia=48h
