spring.application.name=alertacuida

# Base de datos: los valores reales llegan por variables de entorno (nunca en el repositorio)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alertacuida}
spring.datasource.username=${DB_USUARIO:alertacuida}
spring.datasource.password=${DB_CLAVE:}

# Flyway aplica las migraciones de adapters/src/main/resources/db/migration al arrancar
spring.flyway.locations=classpath:db/migration

# Inicio de sesión. Las claves llegan por variables de entorno; sin ellas no arranca.
# RUN_CLAVE: clave del HMAC de rut_hash. Si cambia, hay que recalcular rut_hash de todos los usuarios.
# JWT_CLAVE: firma de los tokens, al menos 32 caracteres.
# CIFRADO_CLAVE: llave AES-256 de los datos personales, 32 bytes en base64 (openssl rand -base64 32).
#   Si se pierde, los datos cifrados no se pueden leer: guardar una copia fuera del servidor (docs/backend.md).
alertacuida.seguridad.clave-run=${RUN_CLAVE}
alertacuida.seguridad.clave-jwt=${JWT_CLAVE}
alertacuida.seguridad.clave-cifrado=${CIFRADO_CLAVE}
alertacuida.seguridad.duracion-token=15m
# Sesión del dashboard: máximo desde el login, cierre por inactividad y gracia para pestañas simultáneas.
# duracion-token no puede superar la inactividad. cookie-segura=true exige HTTPS.
alertacuida.seguridad.sesion.duracion-maxima=10h
alertacuida.seguridad.sesion.inactividad=15m
alertacuida.seguridad.sesion.gracia-rotacion=10s
alertacuida.seguridad.sesion.cookie-segura=true
alertacuida.seguridad.bloqueo.intentos=5
alertacuida.seguridad.bloqueo.ventana=15m

# El backend corre detrás de nginx: la IP real del navegador llega en X-Forwarded-For (ver frontend/nginx.conf).
server.forward-headers-strategy=native

# Valores base del Anexo B: rigen cuando el usuario no tiene ajustes propios.
# PROVISIONALES: falta que los valide el equipo clínico. Cambiarlos cambia la configuración de todos los relojes.
# FC en latidos por minuto: grave bajo < mínimo normal < máximo normal < grave alto.
alertacuida.clinica.umbral-fc.grave-bajo=40
alertacuida.clinica.umbral-fc.normal-min=50
alertacuida.clinica.umbral-fc.normal-max=110
alertacuida.clinica.umbral-fc.grave-alto=130
# SpO2 en %, sin límite alto: grave bajo < mínimo normal.
alertacuida.clinica.umbral-spo2.grave-bajo=88
alertacuida.clinica.umbral-spo2.normal-min=92
# Minutos que el reloj espera la confirmación de un contacto antes de pasar al siguiente.
alertacuida.clinica.minutos-espera=5
# Versión de la matriz de riesgo FC x SpO2 que aplica el reloj. PROVISIONAL hasta recibir el Anexo B;
# cambiarla hace que todos los relojes descarguen la configuración nueva.
alertacuida.clinica.version-matriz=PROVISIONAL
# Regla de tendencia: minutos seguidos fuera del rango normal, sin llegar al límite grave, para que el reloj
# genere la alerta. Vale para FC y SpO2 en los pacientes con el módulo activo. PROVISIONAL hasta que lo valide
# el equipo clínico. Las lecturas llegan cada 30 minutos: es el mínimo. Cambiarlo cambia la configuración de todos.
alertacuida.clinica.minutos-tendencia=120
# Gravedad con que el reloj envía esa alerta: LEVE, MEDIA o GRAVE. Provisional; cambiarla no exige actualizar los relojes.
alertacuida.clinica.severidad-tendencia=MEDIA

# Reloj que envía demasiadas alertas (posible falla): desde la alerta número avisar-desde en ventana-minutos
# el servidor crea una alerta técnica EXCESO_ALERTAS (leve) para revisar el reloj. No rechaza ninguna alerta.
alertacuida.alertas.avisar-desde=10
alertacuida.alertas.ventana-minutos=60

# Reglas de ausencia. intervalo: cada cuánto se revisan los relojes (formato ISO-8601, PT5M = 5 minutos).
# silencio: tiempo sin sincronizar para crear SILENCIO_DATOS. bateria-minima: bajo este % en 2 sincronizaciones
# seguidas se crea BATERIA_BAJA. RELOJ_NO_PUESTO solo cuenta sincronizaciones del mismo día, desde hora-inicio-dia
# (incluida) hasta hora-fin-dia (excluida), hora de Chile: de noche es normal sacarse el reloj para cargarlo.
alertacuida.vigilancia.intervalo=PT5M
alertacuida.vigilancia.silencio=4h
alertacuida.vigilancia.bateria-minima=20
alertacuida.vigilancia.hora-inicio-dia=8
alertacuida.vigilancia.hora-fin-dia=22

# Calendario hábil (horario y feriados): en calendario.yml, porque los nombres de los feriados llevan
# tildes y Spring lee este archivo en Latin-1.
spring.config.import=classpath:calendario.yml

# Correo institucional. canal: SMTP envía de verdad; SIMULADO solo registra en el log (desarrollo, por defecto).
# remitente: la cuenta institucional. intervalo: cada cuánto se encola y envía (ISO-8601, PT30S = 30 segundos).
# ventana: hasta qué tan atrás se buscan alertas y WhatsApp fallidos; lo más antiguo no se avisa.
# reintentos: espera antes de cada reintento de un correo fallido; agotados, queda fallido y visible para el equipo.
alertacuida.correo.canal=${CORREO_CANAL:SIMULADO}
alertacuida.correo.remitente=${CORREO_REMITENTE:no-responder@localhost}
alertacuida.correo.url-dashboard=${DASHBOARD_URL:http://localhost:5173}
alertacuida.correo.intervalo=PT30S
alertacuida.correo.ventana=PT1H
alertacuida.correo.reintentos=PT1M,PT5M,PT15M
# Servidor SMTP institucional: los valores reales llegan por variables de entorno (secreto, nunca en el repositorio).
# Por defecto apunta a Mailpit (docker compose), que recibe los correos sin enviarlos.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PUERTO:1025}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_CLAVE:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Un servidor de correo caído no debe marcar el backend como caído: el correo tiene sus propios reintentos
management.health.mail.enabled=false

# Enlaces de activación del personal nuevo. DASHBOARD_URL: dirección pública del dashboard.
alertacuida.seguridad.activacion.url=${DASHBOARD_URL:http://localhost:5173}/activar
alertacuida.seguridad.activacion.vigencia=48h
