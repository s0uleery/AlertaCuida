# Textos de los correos de AlertaCuida. Lo importa application.properties, igual que calendario.yml.
# Está en YAML y no en application.properties porque Spring lee los .properties en Latin-1, y los textos llevan
# tildes. Cambiarlo requiere reiniciar el backend (con Docker: docker compose up -d --build).
#
# Reglas que no se pueden romper (las revisa TextosCorreoRealesTest al correr las pruebas):
#   - Sin datos clínicos: del paciente solo su alias; de la alerta, su folio y su gravedad. No nombrar qué se
#     detectó en una alerta de salud (caída, frecuencia cardíaca, oxígeno...).
#   - En las graves, pedirle al contacto que llame al 131. El enlace al dashboard va solo al equipo; el
#     contacto solo recibe el enlace para responder si va o no ({responder}, obligatorio).
#
# Marcadores: se escriben entre llaves, como {folio}, y el backend los reemplaza al enviar. Cada texto solo
# admite los marcadores que dice su comentario. Si un marcador está mal escrito o falta un texto, el backend
# no arranca y avisa cuál es: así nunca sale un correo con un {marcador} sin rellenar.
# Con mayúscula inicial, como {Reloj}, el valor sale con la primera letra en mayúscula (útil al comenzar una
# oración).
#
# Los textos de varias líneas usan "|": se respetan los saltos de línea tal cual. Una línea en blanco separa
# párrafos. Si un marcador queda vacío (por ejemplo {grave} en una alerta media), su párrafo desaparece sin
# dejar líneas en blanco de más.
#
# Las alertas graves salen marcadas como importantes; eso no se configura aquí.
alertacuida:
  correo:
    textos:
      # Cierre de los correos ({pie}). Sin marcadores.
      pie-equipo: "Mensaje automático de AlertaCuida. No incluye datos clínicos. No responda este correo."
      pie-contacto: "Mensaje automático de AlertaCuida, sistema de teleasistencia del Programa Red Local de Apoyos y Cuidados de la Municipalidad de Coquimbo. La información de esta alerta es reservada: le pedimos no compartirla. No responda este correo."
      pie-carabineros: "Mensaje automático de AlertaCuida. La información de esta alerta es reservada y de uso exclusivo para su atención. No responda este correo."

      # Al equipo, cuando un reloj deja de enviar datos.
      #   {reloj}     "el reloj de Mary" o "un reloj" (ver abajo)
      #   {folio}     folio de la alerta, ej. #142
      #   {dashboard} dirección del dashboard
      #   {pie}       pie-equipo (solo en el cuerpo)
      silencio-datos:
        asunto: "AlertaCuida: {reloj} dejó de sincronizar ({folio})"
        cuerpo: |
          {Reloj} dejó de enviar datos al servidor (alerta {folio}). Puede estar apagado, sin batería o sin señal. Mientras no se recupere, AlertaCuida no puede generar alertas de esa persona.

          Revise la alerta en el dashboard: {dashboard}

          {pie}
        # Valor de {reloj}. Con alias admite {alias}; sin alias, sin marcadores.
        reloj-con-alias: "el reloj de {alias}"
        reloj-sin-alias: "un reloj"

      # Al equipo, por una alerta: las graves y el respaldo de un WhatsApp a la oficina.
      #   {alerta}    "alerta grave #142" o "alerta técnica #142 (batería baja)" (ver abajo)
      #   {deQuien}   " de Mary", o vacío si el paciente no tiene alias (ver abajo)
      #   {folio}     folio de la alerta, ej. #142
      #   {dashboard} dirección del dashboard
      #   {pie}       pie-equipo (solo en el cuerpo)
      alerta-equipo:
        asunto: "AlertaCuida: {alerta}{deQuien}"
        cuerpo: |
          Hay una {alerta}{deQuien} que requiere atención.

          Revise su estado actualizado en el dashboard: {dashboard}

          {pie}
        # Valor de {alerta} en una alerta de salud: admite {gravedad} (ver gravedades) y {folio}.
        alerta-salud: "alerta {gravedad} {folio}"
        # Valor de {alerta} en una alerta técnica: admite {tecnica} (ver tecnicas) y {folio}.
        alerta-tecnica: "alerta técnica {folio} ({tecnica})"
        # Valor de {deQuien} si el paciente tiene alias; admite {alias}. Ojo con el espacio inicial.
        de-quien-con-alias: " de {alias}"

      # A un contacto del paciente, solo cuando no se pudo entregar su WhatsApp (respaldo).
      #   {quien} el alias del paciente, o quien-sin-alias
      #   {folio} folio de la alerta, ej. #142
      #   {grave} el texto "grave" si la alerta es grave; vacío en las demás (solo en el cuerpo)
      #   {pie}   pie-contacto (solo en el cuerpo)
      #   {responder} enlace a la página donde elige "Confirmo que voy" o "No puedo asistir" (obligatorio en
      #               el cuerpo). Abrirlo no responde por la persona: responde al presionar un botón.
      contacto:
        asunto: "AlertaCuida: se solicita verificar cómo está {quien} (alerta {folio})"
        cuerpo: |
          AlertaCuida registró una alerta de {quien} (alerta {folio}). Usted recibe este correo porque figura como contacto de apoyo y no fue posible entregarle el aviso por WhatsApp.

          Por favor, comuníquese con {quien} o vaya a verle lo antes posible.

          {grave}

          En el siguiente enlace encontrará el detalle de la alerta y podrá indicar si puede atenderla:
          {responder}

          {pie}
        # Valor de {quien} si el paciente no tiene alias. Sin marcadores.
        quien-sin-alias: "la persona que usted apoya"
        # Valor de {grave} en una alerta grave. Sin marcadores.
        grave: "Es una alerta grave: si no logra comunicarse con la persona, dirígase al domicilio de inmediato, y al llegar llame al SAMU (131)."

      # A Carabineros (Encargado de turno), por una alerta grave, solo cuando no se pudo entregar su WhatsApp.
      # Si más adelante se le envía siempre (junto con el WhatsApp), hay que cambiar la última frase del cuerpo.
      # Los datos del paciente y del domicilio (nombre, dirección, ubicación, acceso) no van en el correo: se ven en
      # la página del enlace {responder}. No lleva la instrucción del 131: Carabineros actúa con su protocolo y
      # SAMU interviene a través de ellos.
      #   {folio}     folio de la alerta, ej. #142
      #   {responder} enlace a la página con el detalle de la alerta, donde elige "Atenderemos" o "No disponible"
      #               (obligatorio en el cuerpo)
      #   {pie}       pie-carabineros (solo en el cuerpo)
      carabineros:
        asunto: "AlertaCuida: alerta grave {folio}, solicitud de concurrencia"
        cuerpo: |
          Señor(a) Encargado(a) de turno:

          AlertaCuida, sistema de teleasistencia del Programa Red Local de Apoyos y Cuidados, registró una alerta grave (alerta {folio}) de una persona mayor con dependencia y solicita la concurrencia de Carabineros a su domicilio.

          En el siguiente enlace encontrará los datos de la persona y del domicilio, y podrá indicar si una unidad acudirá:
          {responder}

          Le enviamos este aviso por correo porque no fue posible entregárselo por WhatsApp.

          {pie}

      # Al equipo (los coordinadores), cuando una alerta no avanza: el reloj dejó de pedir avisos a mitad del
      # recorrido de contactos (vigilante del escalamiento). Una vez por alerta, en horario laboral.
      #   {alerta}    "alerta grave #142", igual que en alerta-equipo
      #   {deQuien}   " de Mary", o vacío si el paciente no tiene alias
      #   {folio}     folio de la alerta, ej. #142
      #   {minutos}   minutos sin noticias del reloj (alertacuida.escalamiento.plazo) (solo en el cuerpo)
      #   {dashboard} dirección del dashboard
      #   {pie}       pie-equipo (solo en el cuerpo)
      vigilante:
        asunto: "AlertaCuida: la {alerta}{deQuien} no avanza"
        cuerpo: |
          La {alerta}{deQuien} sigue abierta y no se ha avisado a ningún contacto en los últimos {minutos} minutos. El reloj puede haberse quedado sin batería o sin señal, por lo que la persona podría no estar recibiendo ayuda.

          Comuníquese con la persona o sus contactos y revise la alerta en el dashboard: {dashboard}

          {pie}

      # Cómo se nombra cada gravedad ({gravedad}). Deben estar las tres.
      gravedades:
        LEVE: "leve"
        MEDIA: "media"
        GRAVE: "grave"

      # Cómo se nombra cada alerta técnica ({tecnica}). Deben estar todas: el silencio de datos tiene su propia
      # plantilla y no va aquí.
      tecnicas:
        BATERIA_BAJA: "batería baja"
        RELOJ_NO_PUESTO: "reloj no puesto"
        EXCESO_ALERTAS: "exceso de alertas"