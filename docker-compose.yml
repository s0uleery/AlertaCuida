# Base de datos, backend y dashboard para desarrollo y demos, con el perfil dev:
# claves de desarrollo y datos de ejemplo, nunca datos reales. Requisitos y versiones: Versiones.md.
#
# Primera vez: copiar .env.example como .env (credenciales locales, no se sube al repositorio).
# Levantar todo:       docker compose up -d --build     (dashboard en http://localhost:5173)
# Solo la base:        docker compose up -d postgres    (para correr el backend con Maven o IntelliJ)
# Ver si está listo:   docker compose ps                (estado "healthy")
# Ver los registros:   docker compose logs -f backend
# Detener:             docker compose down              (los datos se conservan en el volumen)
# Empezar de cero:     docker compose down -v           (borra los datos; Flyway recrea todo al arrancar el backend)

# Nombre fijo: el contenedor y el volumen se llaman igual en cualquier computador, sin importar la carpeta
name: alertacuida

services:
  postgres:
    # Misma versión que el servidor y que las pruebas (PostgresDePrueba.java)
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-alertacuida}
      POSTGRES_USER: ${DB_USUARIO:-alertacuida}
      POSTGRES_PASSWORD: "${DB_CLAVE:?Falta DB_CLAVE, copiar .env.example como .env}"
      # UTF-8 para los nombres con tildes y ñ, sin depender del idioma del computador
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      # Si el 5432 ya está ocupado (otro PostgreSQL instalado), cambiar DB_PUERTO en .env
      - "${DB_PUERTO:-5432}:5432"
    volumes:
      # Desde PostgreSQL 18 los datos van en una subcarpeta por versión: se monta la carpeta de arriba
      - datos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # El contexto es la raíz porque compila todos los módulos de Maven
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Reemplaza la dirección del perfil dev: dentro de Docker la base está en "postgres", no en localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NOMBRE:-alertacuida}
      DB_USUARIO: ${DB_USUARIO:-alertacuida}
      DB_CLAVE: "${DB_CLAVE:?Falta DB_CLAVE, copiar .env.example como .env}"
      # Dirección de los enlaces de activación del personal nuevo
      DASHBOARD_URL: http://localhost:${FRONT_PUERTO:-5173}
    ports:
      - "${BACK_PUERTO:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Tiempo para arrancar y aplicar las migraciones, sin contar los fallos como definitivos
      start_period: 60s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONT_PUERTO:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datos-postgres:
