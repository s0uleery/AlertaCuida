# Sirve el dashboard compilado y reenvía /api al backend: el navegador ve un solo origen y no hace falta CORS
# (lo mismo que hace el proxy de vite.config.ts en desarrollo).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se reemplaza lo que mande el navegador: así nadie puede falsear la IP que queda en la auditoría
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Las rutas del dashboard (/activar, /usuarios...) las resuelve React en el navegador
    location / {
        try_files $uri /index.html;
    }
}
